<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="240" height="240" rx="32" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative code symbols -->
  <text x="25" y="55" fill="#334155" font-family="monospace" font-size="20" font-weight="bold">&lt;/&gt;</text>
  <text x="185" y="80" fill="#334155" font-family="monospace" font-size="18" font-weight="bold">{ ; }</text>
  <circle cx="195" cy="180" r="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M190 180h10 M195 175v10" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>

  <!-- Character Illustration -->
  <g transform="translate(20, 20)">
    <!-- Shoulders / Body -->
    <path d="M35 185 C40 135, 160 135, 165 185 Z" fill="url(#primaryGrad)" filter="url(#subtleShadow)"/>
    <!-- Collar / Inner Shirt -->
    <polygon points="100,140 85,165 115,165" fill="#ffffff" opacity="0.9"/>

    <!-- Neck -->
    <rect x="88" y="112" width="24" height="28" rx="6" fill="#fdba74"/>

    <!-- Head / Face -->
    <ellipse cx="100" cy="85" rx="38" ry="44" fill="url(#skinGrad)" filter="url(#subtleShadow)"/>

    <!-- Hair -->
    <path d="M62 76 C60 40, 95 32, 128 42 C140 46, 142 65, 138 78 C135 60, 125 50, 102 50 C80 50, 68 62, 62 76 Z" fill="#1e1b4b"/>
    <path d="M62 75 C60 82, 61 95, 63 100 C65 92, 67 85, 70 80 Z" fill="#1e1b4b"/>

    <!-- Glasses Frame -->
    <rect x="72" y="75" width="22" height="16" rx="4" fill="none" stroke="#0f172a" stroke-width="3"/>
    <rect x="106" y="75" width="22" height="16" rx="4" fill="none" stroke="#0f172a" stroke-width="3"/>
    <line x1="94" y1="83" x2="106" y2="83" stroke="#0f172a" stroke-width="3"/>
    <!-- Glasses Glare -->
    <line x1="75" y1="78" x2="82" y2="78" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <line x1="109" y1="78" x2="116" y2="78" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- Smile -->
    <path d="M92 108 Q100 116 108 108" fill="none" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
